AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Logistics-Prod Edge Stack — ACM (us-east-1) + WAF (CLOUDFRONT scope) +
  CloudFront distribution (two origins: ALB + S3) + OAC + Route 53 (optional).

  IMPORTANT: Deploy this stack ONLY in us-east-1, regardless of which region
  your backend stack runs in.  CloudFront distributions and WAF Web ACLs with
  scope=CLOUDFRONT are global services but their control plane lives in us-east-1.
  ACM certificates attached to CloudFront must also exist in us-east-1.

  Deploy AFTER 01-backend.yaml is in CREATE_COMPLETE.

# ============================================================================
# PARAMETERS
# ============================================================================
Parameters:

  BackendStackName:
    Type: String
    Description: >
      Name of the 01-backend.yaml stack.
      Used to import AlbDnsName, MediaBucketName, and MediaBucketArn.

  DomainName:
    Type: String
    Default: ""
    Description: >
      Optional. Your custom domain (e.g. logistics.example.com).
      If provided:
        * An ACM certificate is issued for this domain in us-east-1 (for CloudFront).
        * The CloudFront distribution lists this domain as an alias (CNAME).
        * An optional Route 53 A-alias record is created if HostedZoneId is also set.
      If empty, the distribution is reachable only via its *.cloudfront.net URL.

  HostedZoneId:
    Type: String
    Default: ""
    Description: >
      Optional. Route 53 Hosted Zone ID for DomainName.
      Required only if DomainName is set and you want an A-alias record created.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Cross-stack reference" }
        Parameters: [BackendStackName]
      - Label: { default: "Custom domain (optional)" }
        Parameters: [DomainName, HostedZoneId]

# ============================================================================
# CONDITIONS
# ============================================================================
Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasHostedZone:   !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]

# ============================================================================
# RESOURCES
# ============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # ACM Certificate — us-east-1, for CloudFront
  #
  # Teaching point — WHY must this be in us-east-1?
  #   CloudFront is a global service whose control plane runs in us-east-1.
  #   When you attach a cert to a CloudFront distribution, CloudFront needs to
  #   access the private key at every edge location.  AWS replicates the cert
  #   from us-east-1 to all edge locations automatically, but ONLY for certs
  #   that were issued in us-east-1.  A cert issued in another region (e.g. your
  #   ALB cert in eu-west-1) is invisible to CloudFront.
  #
  #   Consequence: you always need two certs for the same domain:
  #     1. us-east-1  → CloudFront
  #     2. app region → ALB          (created in 01-backend.yaml)
  #   Both use DNS validation with the SAME CNAME record in your DNS provider.
  #   You only need to add the CNAME once; ACM uses it to validate both requests.
  # ---------------------------------------------------------------------------
  CloudFrontCertificate:
    Condition: HasCustomDomain
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cf-cert"
        - Key: Purpose
          Value: CloudFront-us-east-1
        - Key: ManagedByCloudFormation
          Value: "true"

  # ---------------------------------------------------------------------------
  # WAF Web ACL — scope CLOUDFRONT, must be in us-east-1
  #
  # Rules:
  #   1. AWS Common Rule Set  — blocks SQLi, XSS, LFI, and other OWASP Top 10.
  #   2. IP Reputation List   — blocks known malicious IPs (scanners, bots).
  #   3. RateLimit            — blocks IPs making > 100 requests per 5 minutes.
  #      (Smoke test B7 fires 200 requests and expects 403s after ~100.)
  # ---------------------------------------------------------------------------
  WafWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: logistics-prod-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-waf"
        SampledRequestsEnabled: true
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-common-rules"
            SampledRequestsEnabled: true

        - Name: AWS-AWSManagedRulesAmazonIpReputationList
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-ip-reputation"
            SampledRequestsEnabled: true

        - Name: RateLimit
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-rate-limit"
            SampledRequestsEnabled: true

      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-waf"
        - Key: ManagedByCloudFormation
          Value: "true"

  # ---------------------------------------------------------------------------
  # CloudFront Origin Access Control (OAC)
  #
  # OAC replaces the older Origin Access Identity (OAI) for S3 origins.
  # It signs requests from CloudFront to S3 with SigV4 so S3 can verify
  # that the request came from your specific distribution.
  # The S3 bucket blocks all public access; only requests with the correct
  # OAC signature (matching the distribution ARN) are allowed.
  # ---------------------------------------------------------------------------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: OAC for Logistics-Prod media bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------------------------------------------------------------------
  # S3 Bucket Policy — allow CloudFront to read via OAC
  #
  # The media bucket lives in 01-backend.yaml.  This policy is applied here
  # because we need the CloudFront distribution ARN (which is only known
  # after the distribution is created in this stack).
  # ---------------------------------------------------------------------------
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Fn::ImportValue: !Sub "${BackendStackName}-MediaBucketName"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub
              - "${BucketArn}/*"
              - BucketArn:
                  Fn::ImportValue: !Sub "${BackendStackName}-MediaBucketArn"
            Condition:
              StringEquals:
                "aws:SourceArn": !Sub
                  - "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistId}"
                  - DistId: !Ref CloudFrontDistribution

  # ---------------------------------------------------------------------------
  # Custom cache policies
  # ---------------------------------------------------------------------------

  # /track/* cache policy: 60-second TTL, no cookies, no auth.
  # The tracking page is public and changes infrequently within 60s.
  TrackCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-track-60s"
        Comment: 60s TTL for public tracking pages
        DefaultTTL: 60
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  # ---------------------------------------------------------------------------
  # CloudFront Distribution
  #
  # Two origins:
  #   alb-origin  — the Application Load Balancer (dynamic content)
  #   s3-origin   — the S3 media bucket (photos and static assets)
  #
  # Five cache behaviors (evaluated in order of path specificity):
  #   /admin/*   → ALB, no cache, all headers + cookies forwarded
  #   /driver/*  → ALB, no cache, all headers + cookies forwarded
  #   /track/*   → ALB, 60s TTL, no cookies (public, cacheable)
  #   /static/*  → S3, long TTL (vendored CSS/JS)
  #   /media/*   → S3, long TTL (proof-of-delivery photos)
  #   /*         → ALB, no cache (default for dashboard, /, etc.)
  #
  # HTTP → HTTPS redirect: viewer protocol policy is redirect-to-https on all
  # behaviors.  CloudFront enforces HTTPS; the ALB sees HTTP:80.
  # ---------------------------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: WafWebAcl
    Properties:
      DistributionConfig:
        Comment: Logistics-Prod CDN
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100

        # Custom domain alias (optional)
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue

        # ACM cert (only attached when custom domain is provided)
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CloudFrontCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        # WAF Web ACL
        WebACLId: !GetAtt WafWebAcl.Arn

        Origins:
          # --- ALB origin (dynamic Flask app) ---
          - Id: alb-origin
            DomainName:
              Fn::ImportValue: !Sub "${BackendStackName}-AlbDnsName"
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5

          # --- S3 origin (media bucket) ---
          - Id: s3-origin
            DomainName: !Sub
              - "${BucketName}.s3.${AWS::Region}.amazonaws.com"
              - BucketName:
                  Fn::ImportValue: !Sub "${BackendStackName}-MediaBucketName"
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""  # Empty because we use OAC, not OAI

        # ---- Cache behaviors (checked before DefaultCacheBehavior) ----------
        CacheBehaviors:

          # /admin/* — Admins-only Flask-Admin GUI.
          # Forward everything: cookies (session token), Authorization header.
          # CachingDisabled: every request goes to origin, no CloudFront cache.
          - PathPattern: /admin/*
            TargetOriginId: alb-origin
            ViewerProtocolPolicy: redirect-to-https
            # CachingDisabled managed policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewer: forward all headers, cookies, query strings
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods:  [GET, HEAD]

          # /driver/* — Driver photo upload.
          - PathPattern: /driver/*
            TargetOriginId: alb-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods:  [GET, HEAD]

          # /track/* — Public shipment tracking. Cached for 60 seconds.
          # No cookies forwarded (keeps cache keys clean for all visitors).
          - PathPattern: /track/*
            TargetOriginId: alb-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: !Ref TrackCachePolicy
            # AllViewerExceptHostHeader: forward query strings but not cookies/auth
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD]
            CachedMethods:  [GET, HEAD]

          # /static/* — Vendored CSS/JS (Flask-Admin assets uploaded to S3).
          # Long TTL: browser / CloudFront cache for up to 1 year.
          - PathPattern: /static/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            # CachingOptimized managed policy (long TTL, gzip/brotli enabled)
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            # CORS-S3Origin: adds Origin header so S3 returns CORS headers
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
            AllowedMethods: [GET, HEAD]
            CachedMethods:  [GET, HEAD]

          # /media/* — Proof-of-delivery photos stored in S3.
          - PathPattern: /media/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
            AllowedMethods: [GET, HEAD]
            CachedMethods:  [GET, HEAD]

        # ---- Default behavior (/*) — dashboard, auth, health, etc. ----------
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods:  [GET, HEAD]

      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-distribution"
        - Key: ManagedByCloudFormation
          Value: "true"

  # ---------------------------------------------------------------------------
  # Route 53 A-alias record (optional)
  #
  # Creates  logistics.example.com  →  CloudFront distribution.
  # Requires both DomainName and HostedZoneId to be set.
  #
  # Teaching note: Use an A record alias (not a CNAME) for the apex domain
  # (example.com).  CNAME at the apex is not valid DNS; Route 53 aliases
  # resolve it correctly at the DNS level.  For subdomains (logistics.example.com)
  # both A-alias and CNAME work, but A-alias has no extra DNS lookup cost.
  # ---------------------------------------------------------------------------
  Route53Record:
    Condition: HasHostedZone
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # CloudFront's hosted zone ID is always Z2FDTNDATAQYW2 (AWS global constant).
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

# ============================================================================
# OUTPUTS
# ============================================================================
Outputs:

  DistributionId:
    Description: CloudFront distribution ID (needed for cache invalidations)
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}-DistributionId"

  DistributionDomain:
    Description: CloudFront default domain (*.cloudfront.net) — use as APP_URL in 01-backend
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-DistributionDomain"

  PublicUrl:
    Description: Public URL (custom domain if set, otherwise *.cloudfront.net)
    Value: !If
      - HasCustomDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${CloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-PublicUrl"

  MediaBucketName:
    Description: S3 media bucket name (re-exported for convenience)
    Value:
      Fn::ImportValue: !Sub "${BackendStackName}-MediaBucketName"
    Export:
      Name: !Sub "${AWS::StackName}-MediaBucketName"

  WafWebAclArn:
    Description: WAF Web ACL ARN
    Value: !GetAtt WafWebAcl.Arn
    Export:
      Name: !Sub "${AWS::StackName}-WafArn"

  NextSteps:
    Description: What to do after this stack is deployed
    Value: !Sub >
      1. Copy the DistributionDomain output (https://xxxx.cloudfront.net).
      2. Update the Cognito app client in 01-backend stack:
         - Callback URL: https://xxxx.cloudfront.net/auth/callback
         - Logout URL: https://xxxx.cloudfront.net/
      3. Update the APP_URL env var on EC2 instances (trigger ASG instance refresh
         after updating the Launch Template or running
         aws autoscaling start-instance-refresh).
      4. Run smoke tests from the verification section in the console guide.
