AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::SecretsManager-2020-07-23
Description: >
  Logistics-Prod  -  single self-contained stack. Cognito + Secrets Manager (rotation) +
  RDS PostgreSQL Multi-AZ + ALB + ASG + S3 media bucket + CloudFront + WAFv2 + OAC +
  Route 53 (optional) + CloudWatch alarms.
  Self-contained: creates its own VPC, subnets, IGW, route tables, and NAT.

  NOTE: This template assumes deployment in us-east-1. CloudFront distributions and WAF
  Web ACLs with scope=CLOUDFRONT, and ACM certificates for CloudFront, must reside in
  us-east-1. For deployments where the backend must run in a non-us-east-1 region,
  split back into 01-backend.yaml + 02-edge.yaml (preserved in git history).

# ============================================================================
# PARAMETERS
# ============================================================================
Parameters:

  # ---- VPC networking (self-contained  -  stack creates its own VPC) ----------
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.20.0.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.20.1.0/24
  AppSubnetACidr:
    Type: String
    Default: 10.20.10.0/24
  AppSubnetBCidr:
    Type: String
    Default: 10.20.11.0/24
  DbSubnetACidr:
    Type: String
    Default: 10.20.20.0/24
  DbSubnetBCidr:
    Type: String
    Default: 10.20.21.0/24

  # ---- Application artifact -------------------------------------------------
  ArtifactBucket:
    Type: String
    Description: S3 bucket containing the zipped Flask app.

  ArtifactKey:
    Type: String
    Default: logistics-prod/app.zip
    Description: S3 key of app.zip (must contain app.py + requirements.txt at the root).

  # ---- Compute --------------------------------------------------------------
  AppInstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium, t4g.large, m6g.large, m6g.xlarge]
    Description: EC2 instance type for ASG members (ARM64 Graviton).

  AsgMinSize:
    Type: Number
    Default: 2

  AsgMaxSize:
    Type: Number
    Default: 4

  AsgDesiredCapacity:
    Type: Number
    Default: 2

  # ---- Database -------------------------------------------------------------
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.t4g.large]
    Description: >
      Note: db.t4g.micro does not support Multi-AZ.
      Use db.t4g.small or larger for this stack.

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20

  DbSecretName:
    Type: String
    Default: rds/logistics-prod
    Description: Secrets Manager secret name for RDS credentials.

  # ---- Cognito --------------------------------------------------------------
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: '[a-z0-9-]+'
    Description: >
      Prefix for the Cognito Hosted UI domain (must be globally unique).
      Full domain becomes: <prefix>-<AccountId>.auth.<Region>.amazoncognito.com
      Example: logistics-prod-auth

  AdminInitialEmail:
    Type: String
    Default: ""
    Description: >
      Optional. Email address for the first Admin user.
      Cognito sends a temporary password; user sets a permanent one on first login.
      Leave empty to create users manually in the Cognito console.

  # ---- Custom domain (optional) --------------------------------------------
  DomainName:
    Type: String
    Default: ""
    Description: >
      Optional. Your custom domain (e.g. logistics.example.com).
      If provided, ACM certificates are created for both the ALB (in this region) and
      CloudFront (in us-east-1  -  same cert when deploying to us-east-1), and the
      CloudFront distribution lists this domain as an alias (CNAME).
      DNS validation  -  you must add the CNAME record to your DNS provider.
      Leave empty to use the auto-assigned *.cloudfront.net URL.

  HostedZoneId:
    Type: String
    Default: ""
    Description: >
      Optional. Route 53 Hosted Zone ID for DomainName.
      Required only if DomainName is set and you want an A-alias record created.

  # ---- VPC endpoint toggles (set to false if another stack already owns them)
  CreateS3GatewayEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  CreateInterfaceEndpoints:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "VPC networking (self-contained)" }
        Parameters: [VpcCidr, PublicSubnetACidr, PublicSubnetBCidr, AppSubnetACidr, AppSubnetBCidr, DbSubnetACidr, DbSubnetBCidr]
      - Label: { default: "Application artifact" }
        Parameters: [ArtifactBucket, ArtifactKey]
      - Label: { default: "Compute" }
        Parameters: [AppInstanceType, AsgMinSize, AsgMaxSize, AsgDesiredCapacity]
      - Label: { default: "Database" }
        Parameters: [DbInstanceClass, DbAllocatedStorage, DbSecretName]
      - Label: { default: "Cognito" }
        Parameters: [CognitoDomainPrefix, AdminInitialEmail]
      - Label: { default: "Custom domain (optional)" }
        Parameters: [DomainName, HostedZoneId]
      - Label: { default: "VPC endpoint toggles" }
        Parameters: [CreateS3GatewayEndpoint, CreateInterfaceEndpoints]

# ============================================================================
# CONDITIONS
# ============================================================================
Conditions:
  HasCustomDomain:         !Not [!Equals [!Ref DomainName, ""]]
  HasHostedZone:           !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref HostedZoneId, ""]]
  CreateInitialAdminUser:  !Not [!Equals [!Ref AdminInitialEmail, ""]]
  ShouldCreateS3Endpoint:  !Equals [!Ref CreateS3GatewayEndpoint, "true"]
  ShouldCreateInterfaceEndpoints: !Equals [!Ref CreateInterfaceEndpoints, "true"]

# ============================================================================
# RESOURCES
# ============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # VPC, Subnets, Internet Gateway, Route Tables
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"
        - Key: ManagedByCloudFormation
          Value: "true"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"
        - Key: ManagedByCloudFormation
          Value: "true"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-a"
        - Key: ManagedByCloudFormation
          Value: "true"

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-b"
        - Key: ManagedByCloudFormation
          Value: "true"

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-a"
        - Key: ManagedByCloudFormation
          Value: "true"

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-b"
        - Key: ManagedByCloudFormation
          Value: "true"

  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DbSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-a"
        - Key: ManagedByCloudFormation
          Value: "true"

  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DbSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-b"
        - Key: ManagedByCloudFormation
          Value: "true"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"
        - Key: ManagedByCloudFormation
          Value: "true"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"
        - Key: ManagedByCloudFormation
          Value: "true"

  AppSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref PrivateRouteTable

  AppSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------------------------
  # Cognito User Pool
  #
  # Teaching points:
  #   * Cognito is the source of truth for identity (no users table in the DB).
  #   * Hosted UI handles login / MFA / password reset  -  zero auth UI to build.
  #   * id_token is a signed JWT. Flask validates it using the Cognito JWKS
  #     endpoint (public keys). No Cognito API call needed per request.
  #   * Groups (Admins / Drivers) are embedded in the id_token as
  #     cognito:groups: ["Admins"]. The app reads them from the JWT claims.
  # ---------------------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      # Append AccountId so the prefix is globally unique without extra input.
      Domain: !Sub "${CognitoDomainPrefix}-${AWS::AccountId}"
      UserPoolId: !Ref CognitoUserPool

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub "${AWS::StackName}-web-client"
      GenerateSecret: false  # Public client  -  safe because token exchange is server-side
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code               # Authorization Code flow (most secure for web apps)
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      # Callback URLs are automatically wired to the CloudFront domain.
      # When HasCustomDomain is true the custom domain is added as a second entry.
      CallbackURLs:
        - !Sub "https://${CloudFrontDistribution.DomainName}/auth/callback"
        - !If [HasCustomDomain, !Sub "https://${DomainName}/auth/callback", !Ref "AWS::NoValue"]
      LogoutURLs:
        - !Sub "https://${CloudFrontDistribution.DomainName}/"
        - !If [HasCustomDomain, !Sub "https://${DomainName}/", !Ref "AWS::NoValue"]
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      Description: Full access to Flask-Admin GUI and all driver routes
      UserPoolId: !Ref CognitoUserPool

  CognitoDriversGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Drivers
      Description: Access to driver photo upload routes only
      UserPoolId: !Ref CognitoUserPool

  # Optional: create the first admin user (Cognito emails a temporary password).
  CognitoInitialAdminUser:
    Condition: CreateInitialAdminUser
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref AdminInitialEmail
      UserAttributes:
        - Name: email
          Value: !Ref AdminInitialEmail
        - Name: email_verified
          Value: "true"
      DesiredDeliveryMediums:
        - EMAIL

  CognitoInitialAdminAttachment:
    Condition: CreateInitialAdminUser
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    DependsOn: CognitoInitialAdminUser
    Properties:
      GroupName: Admins
      Username: !Ref AdminInitialEmail
      UserPoolId: !Ref CognitoUserPool

  # ---------------------------------------------------------------------------
  # ACM Certificate  -  single cert for both ALB HTTPS:443 and CloudFront
  #
  # Teaching note: CloudFront requires its certificate in us-east-1. Because
  # this merged template is locked to us-east-1, one cert covers both the ALB
  # listener and the CloudFront distribution. One DNS validation CNAME is all
  # that is needed.  (In a split-region setup you would need two separate certs:
  # one in us-east-1 for CloudFront and one in the app region for the ALB.)
  # ---------------------------------------------------------------------------
  AcmCertificate:
    Condition: HasCustomDomain
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !If [HasHostedZone, !Ref HostedZoneId, !Ref "AWS::NoValue"]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cert"
        - Key: ManagedByCloudFormation
          Value: "true"

  # ---------------------------------------------------------------------------
  # Secrets Manager  -  DB credentials with automatic rotation
  #
  # Teaching points:
  #   * The secret is pre-created with username/engine/dbname/port.
  #   * SecretTargetAttachment patches the host/port in after RDS exists.
  #   * RotationSchedule uses HostedRotationLambda  -  CloudFormation deploys
  #     the rotation Lambda automatically (no SAM transform needed).
  #   * The Lambda runs inside the VPC so it can reach RDS:5432 directly.
  #   * After each rotation, app.py reads the NEW credentials from Secrets
  #     Manager at startup. Rotation triggers a rolling instance refresh.
  # ---------------------------------------------------------------------------
  DBSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Ref DbSecretName
      Description: RDS PostgreSQL credentials for Logistics-Prod.
      GenerateSecretString:
        SecretStringTemplate: >
          {"username":"appadmin","engine":"postgres","dbname":"logistics","port":5432}
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
        RequireEachIncludedType: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-secret"
        - Key: ManagedByCloudFormation
          Value: "true"

  DBSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref DBInstance
      TargetType: AWS::RDS::DBInstance

  DBSecretRotation:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: DBSecretAttachment
    Properties:
      SecretId: !Ref DBSecret
      HostedRotationLambda:
        RotationType: PostgreSQLSingleUser
        RotationLambdaName: !Sub "${AWS::StackName}-secret-rotation"
        VpcSecurityGroupIds: !Ref AppSecurityGroup
        VpcSubnetIds: !Join
          - ","
          - - !Ref AppSubnetA
            - !Ref AppSubnetB
      RotationRules:
        AutomaticallyAfterDays: 30

  # ---------------------------------------------------------------------------
  # S3 Media Bucket
  #
  # Stores proof-of-delivery photos uploaded by drivers.
  # All public access is blocked  -  only CloudFront can read via OAC.
  # App instances write via IAM instance role (AppInstanceRole below).
  # ---------------------------------------------------------------------------
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${AWS::StackName}-media-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls:       true
        IgnorePublicAcls:      true
        BlockPublicPolicy:     true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-media"
        - Key: ManagedByCloudFormation
          Value: "true"

  # ---------------------------------------------------------------------------
  # Security Groups
  # ---------------------------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTP:80 (CloudFront) and HTTPS:443 (direct access)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from CloudFront and internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for direct access
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb-sg"
        - Key: ManagedByCloudFormation
          Value: "true"

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App EC2 instances - only ALB can reach port 80
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-sg"
        - Key: ManagedByCloudFormation
          Value: "true"

  AppFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: HTTP from ALB

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL - app tier + rotation Lambda
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-rds-sg"
        - Key: ManagedByCloudFormation
          Value: "true"

  RdsFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: Postgres from app tier and rotation Lambda (both use AppSecurityGroup)

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: ShouldCreateInterfaceEndpoints
    Properties:
      GroupDescription: HTTPS from app instances to interface endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: HTTPS from app tier
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-endpoint-sg"
        - Key: ManagedByCloudFormation
          Value: "true"

  # ---------------------------------------------------------------------------
  # VPC Endpoints (S3 Gateway + Secrets Manager + SSM)
  # ---------------------------------------------------------------------------
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateS3Endpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      SecurityGroupIds: [!Ref VpcEndpointSecurityGroup]
      PrivateDnsEnabled: true

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      SecurityGroupIds: [!Ref VpcEndpointSecurityGroup]
      PrivateDnsEnabled: true

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      SecurityGroupIds: [!Ref VpcEndpointSecurityGroup]
      PrivateDnsEnabled: true

  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateInterfaceEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      SecurityGroupIds: [!Ref VpcEndpointSecurityGroup]
      PrivateDnsEnabled: true

  # ---------------------------------------------------------------------------
  # NAT Gateway (single-AZ, public subnet A)
  # ---------------------------------------------------------------------------
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"
        - Key: ManagedByCloudFormation
          Value: "true"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-gw"
        - Key: ManagedByCloudFormation
          Value: "true"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # ---------------------------------------------------------------------------
  # RDS PostgreSQL  -  Multi-AZ, 7-day backups, encrypted
  #
  # Teaching point vs. original Logistics:
  #   * MultiAZ: true   -  standby replica in a second AZ.
  #     RDS automatically fails over in ~15-60s if the primary becomes
  #     unavailable. The endpoint DNS name is updated automatically.
  #   * BackupRetentionPeriod: 7  -  keep 7 days of automated backups.
  #     Original Logistics kept only 1.
  # ---------------------------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${AWS::StackName}-db-subnet-group"
      DBSubnetGroupDescription: DB subnets for Logistics-Prod RDS.
      SubnetIds:
        - !Ref DbSubnetA
        - !Ref DbSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-subnet-group"
        - Key: ManagedByCloudFormation
          Value: "true"

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-pg"
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: logistics
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}::username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}::password}}'
      VPCSecurityGroups: [!Ref RdsSecurityGroup]
      DBSubnetGroupName: !Ref DBSubnetGroup
      PubliclyAccessible: false
      MultiAZ: true
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-pg"
        - Key: ManagedByCloudFormation
          Value: "true"

  # ---------------------------------------------------------------------------
  # IAM  -  EC2 instance role
  # ---------------------------------------------------------------------------
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-app-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: logistics-prod-app-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read DB credentials from Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref DBSecret
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${DbSecretName}*"
              # Read app artifact from S3
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ArtifactBucket}/${ArtifactKey}"
              # Write proof-of-delivery photos to the media bucket.
              # Key prefix must be media/shipments/* to match the CloudFront /media/* -> S3 path.
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${MediaBucket.Arn}/media/*"
              # Invalidate CloudFront cache after driver photo upload
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app-role"
        - Key: ManagedByCloudFormation
          Value: "true"

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${AWS::StackName}-app-profile"
      Roles: [!Ref AppInstanceRole]

  # ---------------------------------------------------------------------------
  # Application Load Balancer
  #
  # HTTP:80   -  forwarding to target group.
  #            CloudFront uses this as the ALB origin (HTTP:80).
  # HTTPS:443  -  forwarding to target group (only created if DomainName is set).
  #             Useful for direct admin access.
  #
  # Teaching note on CloudFront -> ALB protocol:
  #   CloudFront uses HTTP:80 to communicate with the ALB.
  #   All public user traffic arrives at CloudFront over HTTPS (enforced by
  #   the viewer protocol policy in the CloudFront distribution). The
  #   CloudFront -> ALB leg stays within AWS network infrastructure.
  #   In production with a custom origin domain + matching cert, you would
  #   configure OriginProtocolPolicy: https-only in the CloudFront distribution.
  # ---------------------------------------------------------------------------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-alb"
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb"
        - Key: ManagedByCloudFormation
          Value: "true"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-tg"
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200' }
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-tg"
        - Key: ManagedByCloudFormation
          Value: "true"

  # HTTP:80 forwarding listener  -  used by CloudFront as the ALB origin.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # HTTPS:443 listener  -  only created when DomainName (and cert) is provided.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCustomDomain
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref AcmCertificate
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------------------
  # Launch Template + Auto Scaling Group
  #
  # New environment variables vs. original Logistics userdata:
  #   COGNITO_USER_POOL_ID -- for JWKS URL construction in app.py
  #   COGNITO_CLIENT_ID    -- for JWT audience validation
  #   COGNITO_DOMAIN       -- for Hosted UI login/token URLs
  #   S3_MEDIA_BUCKET      -- for boto3 put_object in driver_photo_upload
  #   APP_URL              -- automatically set from CloudFront domain at deploy time
  #
  # AppLaunchTemplate depends on CloudFrontDistribution so instances receive
  # the real APP_URL at first boot with no manual intervention.
  # ---------------------------------------------------------------------------
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn: CloudFrontDistribution
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-lt"
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
        InstanceType: !Ref AppInstanceType
        IamInstanceProfile:
          Name: !Ref AppInstanceProfile
        SecurityGroupIds: [!Ref AppSecurityGroup]
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${AWS::StackName}-instance"
              - Key: ManagedByCloudFormation
                Value: "true"
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euxo pipefail
              exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1

              REGION="${AWS::Region}"
              S3_BUCKET="${ArtifactBucket}"
              APP_KEY="${ArtifactKey}"
              SECRET_NAME="${DbSecretName}"
              APP_DIR="/opt/app"
              COGNITO_POOL_ID="${CognitoUserPool}"
              COGNITO_CLIENT="${CognitoUserPoolClient}"
              MEDIA_BUCKET="${MediaBucket}"

              # ---- 1. Base packages ----
              dnf update -y
              dnf install -y python3.11 python3.11-pip nginx unzip awscli-2 postgresql15

              # ---- 2. Fetch app bundle from S3 ----
              mkdir -p "${!APP_DIR}"
              aws s3 cp "s3://${!S3_BUCKET}/${!APP_KEY}" /tmp/app.zip --region "${!REGION}"
              unzip -o /tmp/app.zip -d "${!APP_DIR}"
              rm -f /tmp/app.zip

              # ---- 3. Python venv + dependencies ----
              python3.11 -m venv "${!APP_DIR}/venv"
              "${!APP_DIR}/venv/bin/pip" install --upgrade pip
              "${!APP_DIR}/venv/bin/pip" install -r "${!APP_DIR}/requirements.txt"
              chown -R ec2-user:ec2-user "${!APP_DIR}"

              # ---- 4. Build the Cognito Hosted UI FQDN ----
              # Format: <prefix>-<accountId>.auth.<region>.amazoncognito.com
              COGNITO_HOSTED_DOMAIN="${CognitoDomainPrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"

              # ---- 5. Flask secret key (random per instance, rotate on ASG refresh) ----
              FLASK_KEY="$(openssl rand -hex 32)"

              # APP_URL is resolved at stack deploy time from the CloudFront distribution.
              APP_URL_VALUE="${AppUrl}"

              # ---- 6. systemd unit for gunicorn ----
              cat > /etc/systemd/system/flask-admin.service << UNIT_EOF
              [Unit]
              Description=Logistics-Prod Flask App
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=simple
              User=ec2-user
              Group=ec2-user
              WorkingDirectory=${!APP_DIR}
              Environment="DB_SECRET_NAME=${!SECRET_NAME}"
              Environment="AWS_REGION=${!REGION}"
              Environment="FLASK_SECRET_KEY=${!FLASK_KEY}"
              Environment="COGNITO_USER_POOL_ID=${!COGNITO_POOL_ID}"
              Environment="COGNITO_CLIENT_ID=${!COGNITO_CLIENT}"
              Environment="COGNITO_DOMAIN=${!COGNITO_HOSTED_DOMAIN}"
              Environment="S3_MEDIA_BUCKET=${!MEDIA_BUCKET}"
              Environment="APP_URL=${!APP_URL_VALUE}"
              ExecStart=${!APP_DIR}/venv/bin/gunicorn \
                --workers 2 --bind 127.0.0.1:8000 \
                --access-logfile - --error-logfile - \
                --timeout 60 \
                app:app
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
              UNIT_EOF

              # ---- 7. nginx reverse proxy ----
              rm -f /etc/nginx/conf.d/default.conf
              cat > /etc/nginx/conf.d/flask.conf << 'NGINX_EOF'
              server {
                  listen 80 default_server;
                  server_name _;
                  client_max_body_size 6M;

                  location = /health {
                      access_log off;
                      proxy_pass http://127.0.0.1:8000/health;
                  }

                  location / {
                      proxy_pass         http://127.0.0.1:8000;
                      proxy_set_header   Host              $host;
                      proxy_set_header   X-Real-IP         $remote_addr;
                      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                      proxy_set_header   X-Forwarded-Proto $scheme;
                      proxy_read_timeout 60s;
                  }
              }
              NGINX_EOF

              # ---- 8. Start everything ----
              systemctl daemon-reload
              systemctl enable --now flask-admin
              systemctl enable --now nginx

              echo "user-data finished OK"
            - AppUrl: !If [HasCustomDomain, !Sub "https://${DomainName}", !Sub "https://${CloudFrontDistribution.DomainName}"]

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: [DBSecretAttachment, HttpListener, PrivateDefaultRoute]
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-asg"
      VPCZoneIdentifier:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DesiredCapacity: !Ref AsgDesiredCapacity
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 600
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-asg"
          PropagateAtLaunch: true
        - Key: ManagedByCloudFormation
          Value: "true"
          PropagateAtLaunch: true

  # ---------------------------------------------------------------------------
  # Scaling policies
  # ---------------------------------------------------------------------------
  ScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      Cooldown: 60
      ScalingAdjustment: 2

  ScaleInPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      Cooldown: 120
      ScalingAdjustment: -2

  # ---------------------------------------------------------------------------
  # CloudWatch Alarms
  # ---------------------------------------------------------------------------
  ScaleOutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-asg-cpu-high"
      AlarmDescription: Scale out when average EC2 CPU > 40% for 1 min
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AppAutoScalingGroup
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 40
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref ScaleOutPolicy]

  ScaleInAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-asg-cpu-low"
      AlarmDescription: Scale in when average EC2 CPU < 20% for 2 min
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref AppAutoScalingGroup
      Statistic: Average
      Period: 120
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref ScaleInPolicy]

  # ALB 5xx alarm  -  catches app errors and upstream failures.
  AlbHttp5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-alb-5xx"
      AlarmDescription: ALB 5xx responses > 50 in 1 min  -  investigate app or instances
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # RDS CPU alarm  -  high CPU can signal query inefficiency or connection storms.
  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-rds-cpu-high"
      AlarmDescription: RDS CPU > 80% for 5 min  -  review slow queries or scale up
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstance
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold

  # RDS storage alarm  -  triggers before the disk fills and the instance stalls.
  RdsFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-rds-low-storage"
      AlarmDescription: RDS free storage < 2 GB  -  increase AllocatedStorage before it fills
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      # 2 GiB in bytes
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold

  # ===========================================================================
  # EDGE RESOURCES (CloudFront + WAF + ACM + OAC + Route 53)
  #
  # These resources must run in us-east-1 when this template is deployed there.
  # CloudFront distributions and WAF Web ACLs with scope=CLOUDFRONT are global
  # services whose control plane lives in us-east-1. ACM certificates attached
  # to CloudFront must also be in us-east-1.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # WAF Web ACL  -  scope CLOUDFRONT, must be in us-east-1
  #
  # Rules:
  #   1. AWS Common Rule Set   -  blocks SQLi, XSS, LFI, and other OWASP Top 10.
  #   2. IP Reputation List    -  blocks known malicious IPs (scanners, bots).
  #   3. RateLimit             -  blocks IPs making > 100 requests per 5 minutes.
  # ---------------------------------------------------------------------------
  WafWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: logistics-prod-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-waf"
        SampledRequestsEnabled: true
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-common-rules"
            SampledRequestsEnabled: true

        - Name: AWS-AWSManagedRulesAmazonIpReputationList
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-ip-reputation"
            SampledRequestsEnabled: true

        - Name: RateLimit
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${AWS::StackName}-rate-limit"
            SampledRequestsEnabled: true

      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-waf"
        - Key: ManagedByCloudFormation
          Value: "true"

  # ---------------------------------------------------------------------------
  # CloudFront Origin Access Control (OAC)
  #
  # OAC replaces the older Origin Access Identity (OAI) for S3 origins.
  # It signs requests from CloudFront to S3 with SigV4 so S3 can verify
  # that the request came from your specific distribution.
  # The S3 bucket blocks all public access; only requests with the correct
  # OAC signature (matching the distribution ARN) are allowed.
  # ---------------------------------------------------------------------------
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: OAC for Logistics-Prod media bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---------------------------------------------------------------------------
  # S3 Bucket Policy  -  allow CloudFront to read via OAC
  #
  # Applied here (after CloudFrontDistribution) because the policy Condition
  # requires the CloudFront distribution ARN. Both MediaBucket and
  # CloudFrontDistribution are in the same template so no cross-stack import
  # is needed  -  direct !Ref and !GetAtt resolve correctly.
  # ---------------------------------------------------------------------------
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/*"
            Condition:
              StringEquals:
                "aws:SourceArn": !Sub
                  - "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistId}"
                  - DistId: !Ref CloudFrontDistribution

  # ---------------------------------------------------------------------------
  # Custom cache policies
  # ---------------------------------------------------------------------------

  # /track/* cache policy: 60-second TTL, no cookies, no auth.
  TrackCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-track-60s"
        Comment: 60s TTL for public tracking pages
        DefaultTTL: 60
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true

  # ---------------------------------------------------------------------------
  # CloudFront Distribution
  #
  # Two origins:
  #   alb-origin   -  the Application Load Balancer (dynamic content)
  #   s3-origin    -  the S3 media bucket (photos and static assets)
  #
  # Five cache behaviors (evaluated in order of path specificity):
  #   /admin/*   -> ALB, no cache, all headers + cookies forwarded
  #   /driver/*  -> ALB, no cache, all headers + cookies forwarded
  #   /track/*   -> ALB, 60s TTL, no cookies (public, cacheable)
  #   /static/*  -> S3, long TTL (vendored CSS/JS)
  #   /media/*   -> S3, long TTL (proof-of-delivery photos)
  #   /*         -> ALB, no cache (default for dashboard, /, etc.)
  #
  # HTTP -> HTTPS redirect: viewer protocol policy is redirect-to-https on all
  # behaviors. CloudFront enforces HTTPS; the ALB sees HTTP:80.
  # ---------------------------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: WafWebAcl
    Properties:
      DistributionConfig:
        Comment: Logistics-Prod CDN
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100

        # Custom domain alias (optional)
        Aliases: !If
          - HasCustomDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue

        # ACM cert (only attached when custom domain is provided)
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        # WAF Web ACL
        WebACLId: !GetAtt WafWebAcl.Arn

        Origins:
          # --- ALB origin (dynamic Flask app) ---
          - Id: alb-origin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5

          # --- S3 origin (media bucket) ---
          - Id: s3-origin
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""  # Empty because we use OAC, not OAI

        # ---- Cache behaviors (checked before DefaultCacheBehavior) ----------
        CacheBehaviors:

          # /admin/*  -  Admins-only Flask-Admin GUI.
          # Forward everything: cookies (session token), Authorization header.
          # CachingDisabled: every request goes to origin, no CloudFront cache.
          - PathPattern: /admin/*
            TargetOriginId: alb-origin
            ViewerProtocolPolicy: redirect-to-https
            # CachingDisabled managed policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewer: forward all headers, cookies, query strings
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods:  [GET, HEAD]

          # /driver/*  -  Driver photo upload.
          - PathPattern: /driver/*
            TargetOriginId: alb-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods:  [GET, HEAD]

          # /track/*  -  Public shipment tracking. Cached for 60 seconds.
          # No cookies forwarded (keeps cache keys clean for all visitors).
          - PathPattern: /track/*
            TargetOriginId: alb-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: !Ref TrackCachePolicy
            # AllViewerExceptHostHeader: forward query strings but not cookies/auth
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            AllowedMethods: [GET, HEAD]
            CachedMethods:  [GET, HEAD]

          # /static/*  -  Vendored CSS/JS (Flask-Admin assets uploaded to S3).
          # Long TTL: browser / CloudFront cache for up to 1 year.
          - PathPattern: /static/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            # CachingOptimized managed policy (long TTL, gzip/brotli enabled)
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            # CORS-S3Origin: adds Origin header so S3 returns CORS headers
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
            AllowedMethods: [GET, HEAD]
            CachedMethods:  [GET, HEAD]

          # /media/*  -  Proof-of-delivery photos stored in S3.
          - PathPattern: /media/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf
            AllowedMethods: [GET, HEAD]
            CachedMethods:  [GET, HEAD]

        # ---- Default behavior (/*)  -  dashboard, auth, health, etc. ----------
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods:  [GET, HEAD]

      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-distribution"
        - Key: ManagedByCloudFormation
          Value: "true"

  # ---------------------------------------------------------------------------
  # Route 53 A-alias record (optional)
  #
  # Creates logistics.example.com -> CloudFront distribution.
  # Requires both DomainName and HostedZoneId to be set.
  #
  # Teaching note: Use an A record alias (not a CNAME) for the apex domain.
  # CNAME at the apex is not valid DNS; Route 53 aliases resolve it correctly
  # at the DNS level. For subdomains (logistics.example.com) both A-alias and
  # CNAME work, but A-alias has no extra DNS lookup cost.
  # ---------------------------------------------------------------------------
  Route53Record:
    Condition: HasHostedZone
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # CloudFront's hosted zone ID is always Z2FDTNDATAQYW2 (AWS global constant).
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

# ============================================================================
# OUTPUTS
# ============================================================================
Outputs:

  PublicUrl:
    Description: Public URL (custom domain if set, otherwise *.cloudfront.net)
    Value: !If
      - HasCustomDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${CloudFrontDistribution.DomainName}"

  DistributionDomain:
    Description: CloudFront default domain (https://*.cloudfront.net)
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  DistributionId:
    Description: CloudFront distribution ID (needed for cache invalidations)
    Value: !Ref CloudFrontDistribution

  AlbDnsName:
    Description: ALB DNS name (direct HTTP access for internal testing)
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  AlbUrl:
    Description: ALB direct URL (HTTP  -  for testing before CloudFront is ready)
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}/"

  MediaBucketName:
    Description: S3 media bucket name
    Value: !Ref MediaBucket

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Description: Cognito app client ID (no secret  -  public client)
    Value: !Ref CognitoUserPoolClient

  CognitoHostedUiDomain:
    Description: Cognito Hosted UI domain FQDN
    Value: !Sub "${CognitoDomainPrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"

  DbEndpoint:
    Description: RDS endpoint hostname
    Value: !GetAtt DBInstance.Endpoint.Address

  SecretArn:
    Description: Secrets Manager secret ARN
    Value: !Ref DBSecret

  AsgName:
    Description: Auto Scaling Group name
    Value: !Ref AppAutoScalingGroup

  WafWebAclArn:
    Description: WAF Web ACL ARN
    Value: !GetAtt WafWebAcl.Arn

  VpcId:
    Description: VPC ID created by this stack
    Value: !Ref Vpc

  PublicSubnetAId:
    Description: Public subnet AZ-a
    Value: !Ref PublicSubnetA

  PublicSubnetBId:
    Description: Public subnet AZ-b
    Value: !Ref PublicSubnetB

  AppSubnetAId:
    Description: App (private) subnet AZ-a
    Value: !Ref AppSubnetA

  AppSubnetBId:
    Description: App (private) subnet AZ-b
    Value: !Ref AppSubnetB

  DbSubnetAId:
    Description: DB (isolated) subnet AZ-a
    Value: !Ref DbSubnetA

  DbSubnetBId:
    Description: DB (isolated) subnet AZ-b
    Value: !Ref DbSubnetB

  SchemaBootstrapCommand:
    Description: >
      SSM command to bootstrap the database schema after at least one instance is healthy.
      ASG sets the Name tag to <stack>-asg on instances  -  use that tag value.
    Value: !Sub >
      BACKEND_STACK=${AWS::StackName} APP_REGION=${AWS::Region}
      ./scripts/ssm-run-schema-from-artifact.sh
